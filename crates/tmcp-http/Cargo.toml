[package]
name = "tmcp-http"
description = "Streamable HTTP transport and OAuth for the tmcp MCP runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2"] }
bytes = "1.11"
dashmap = "6.1"
eventsource-stream = "0.2"
form_urlencoded = "1"
futures = "0.3"
http = "1.4"
http-body-util = "0.1.3"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto", "pem", "simple_asn1", "use_pem"] }
oauth2 = { version = "5.0", features = ["reqwest"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6.1"
thiserror = "2.0"
tmcp = { path = "../tmcp", version = "0.6.0" }
tokio = { version = "1.48", features = ["io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "limit"] }
tracing = "0.1"
url = "2.5"
uuid = { version = "1.19", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["test-util"] }
tracing-subscriber = "0.3"
