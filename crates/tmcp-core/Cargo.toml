[package]
name = "tmcp-core"
description = "Protocol types of the Model Context Protocol (MCP), without a runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
base64 = "0.22"
jsonschema = { version = "0.48.1", default-features = false }
mime_guess = "2.0"
owo-colors = "4.3.0"
schemars = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
thiserror = "2.0"
tmcp-macros = { path = "../tmcp-macros", version = "0.6.0" }
