[package]
name = "tmcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
bytes = "1.11"
dashmap = "6.1"
futures = "0.3"
http = "1.4"
schemars = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tmcp-core = { path = "../tmcp-core", version = "0.6.0" }
tmcp-macros = { path = "../tmcp-macros", version = "0.6.0" }
tokio = { version = "1.48", features = ["io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"

[dev-dependencies]
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", branch = "main", features = ["client", "server", "transport-worker", "transport-streamable-http-server"] }
schemars = "1.1"
tokio = { version = "1.48", features = ["test-util"] }
tracing-subscriber = "0.3"
trybuild = "1.0.116"
